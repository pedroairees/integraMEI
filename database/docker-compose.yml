services:
  postgres:
    image: postgres:16-alpine
    container_name: integramei-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-integramei}
      POSTGRES_USER: ${POSTGRES_USER:-integramei}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-integramei_local_dev}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - integramei_postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-integramei} -d ${POSTGRES_DB:-integramei}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  integramei_postgres_data:
